# Prometheus Configuration for ReproLab Production
# Reference: docs/observability-plan.md §4 & §6

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: "reprolab-fastapi"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:8000"]
    scrape_interval: 10s

  - job_name: "reprolab-otel-collector"
    static_configs:
      - targets: ["localhost:8889"]
    scrape_interval: 15s

