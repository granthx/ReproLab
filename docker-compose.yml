services:
  postgres:
    image: postgres:16-alpine
    container_name: reprolab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reprolab
      POSTGRES_USER: reprolab
      POSTGRES_PASSWORD: reprolab
    ports:
      - "5432:5432"
    volumes:
      - reprolab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reprolab -d reprolab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reprolab-postgres-data:
